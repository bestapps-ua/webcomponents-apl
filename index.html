<html>

        #container {
            display: flex;

            border: 1px solid black;
            border-radius: 5px;
        }

        #screen {
            height: 25px;

    <script

            integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
            crossorigin="anonymous">
    </script>

    <!-- Base scripts from webcomponents (sibling repo via orchestration) -->
    <script src="../webcomponents/utils/uid.js"></script>
    <script src="../webcomponents/utils/APLComponentRegistry.js"></script>
    <script src="../webcomponents/BestAppsComponent.js"></script>

    <!-- APL scripts at root -->
    <script src="APLDataComponent.js"></script>
    <script src="APL.js"></script>
    <script src="APLDom.js"></script>
    <script src="APLScreen.js"></script>
    <script src="APLFactory.js"></script>
    <script src="APLPalette.js"></script>
    <script src="APLComponent.js"></script>
    <script src="APLFrameComponent.js"></script>

    <script src="APLMultiChildComponent.js"></script>
    <script src="APLContainerComponent.js"></script>
    <script src="APLTouchWrapperComponent.js"></script>

        new APL({
            vendors: [
                {
                    name: 'Treeselect JS',
                    description: 'https://github.com/dipson88/treeselectjs',
                    js: './vendor/treeselectjs/treeselect.js',
                    css: './vendor/treeselectjs/treeselect.css'
                },
                {
                    name: 'jsoneditor',
                    description: 'https://github.com/josdejong/jsoneditor',
                    js: './vendor/jsoneditor/jsoneditor.js',
                    css: './vendor/jsoneditor/jsoneditor.css'
                }

            ]
        });
    });

</script>

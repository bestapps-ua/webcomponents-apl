<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>APLDom Test</title></head>
<body>
<script src="/webcomponents/utils/uid.js"></script>
<script src="/webcomponents/utils/APLComponentRegistry.js"></script>
<script src="/webcomponents/BestAppsComponent.js"></script>
<script src="/APLProperties.js"></script>
<script src="/APLComponent.js"></script>
<script src="/APLDom.js"></script>
<div id="container">
    <apl-component id="parent1"></apl-component>
    <apl-component id="child1"></apl-component>
    <apl-component id="child2"></apl-component>
</div>
<script>
window.addEventListener('load', () => {
    const parent = document.getElementById('parent1');
    const child1 = document.getElementById('child1');
    const child2 = document.getElementById('child2');
    parent.setAPLName('Parent1');
    parent.setAPLType('APLContainer');
    child1.setAPLName('Child1');
    child1.setAPLType('APLFrame');
    child2.setAPLName('Child2');
    child2.setAPLType('APLText');

    const aplDoc = { document: { mainTemplate: { items: [] } } };
    window._aplDom = new APLDom({ aplDocument: aplDoc });
    window._parent = parent;
    window._child1 = child1;
    window._child2 = child2;
    window._testReady = true;
});
</script>
</body>
</html>

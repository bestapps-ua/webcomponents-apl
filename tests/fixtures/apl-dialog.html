<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>APL Dialog Test — position: fixed in Shadow DOM with transforms</title>
</head>
<body>
<script src="/webcomponents/utils/uid.js"></script>
<script src="/webcomponents/utils/APLComponentRegistry.js"></script>
<script src="/webcomponents/BestAppsComponent.js"></script>
<script src="/APLProperties.js"></script>
<script src="/APLEvents.js"></script>
<script src="/APLComponent.js"></script>
<script src="/Dialogs/APLDialogComponent.js"></script>
<script src="/Dialogs/APLConfirmDialogComponent.js"></script>

<!-- Normal parent (control) -->
<div id="normal-parent" style="width:300px;height:200px;background:#eee;"></div>

<!-- Parent with transform — this is the condition that breaks position: fixed -->
<div id="transformed-parent" style="transform:translateX(200px);width:300px;height:200px;background:#ddd;"></div>

<script>
window._consoleErrors = [];
const origError = console.error;
console.error = function() {
    window._consoleErrors.push(Array.from(arguments).map(String).join(' '));
    origError.apply(console, arguments);
};
window._unhandledErrors = [];
window.addEventListener('unhandledrejection', (e) => {
    window._unhandledErrors.push(e.reason?.message || String(e.reason));
});

window.addEventListener('load', async () => {
    // Dialog 1: inside normal parent (no transform)
    const dialog1 = document.createElement(APLConfirmDialogComponent.tag);
    document.getElementById('normal-parent').appendChild(dialog1);
    await dialog1.loadedDefer.promise;

    // Dialog 2: inside transformed parent (has transform: translateX(200px))
    const dialog2 = document.createElement(APLConfirmDialogComponent.tag);
    document.getElementById('transformed-parent').appendChild(dialog2);
    await dialog2.loadedDefer.promise;

    window._dialog1 = dialog1;
    window._dialog2 = dialog2;
    window._testReady = true;
});
</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>APLDataComponent Test</title>
    <link rel="stylesheet" href="/vendor/jsoneditor/jsoneditor.css">
</head>
<body>
<script src="/webcomponents/utils/uid.js"></script>
<script src="/webcomponents/utils/APLComponentRegistry.js"></script>
<script src="/webcomponents/BestAppsComponent.js"></script>
<script src="/vendor/jsoneditor/jsoneditor.js"></script>
<script src="/APLDataComponent.js"></script>
<div id="container" style="width:400px;height:500px;"></div>
<script>
window._consoleErrors = [];
window._consoleWarnings = [];
window._changedEvents = [];
const origError = console.error;
const origWarn = console.warn;
console.error = function() {
    window._consoleErrors.push(Array.from(arguments).map(String).join(' '));
    origError.apply(console, arguments);
};
console.warn = function() {
    window._consoleWarnings.push(Array.from(arguments).map(String).join(' '));
    origWarn.apply(console, arguments);
};

window._sampleDoc = {
    "type": "APL",
    "version": "1.4",
    "mainTemplate": {
        "parameters": ["payload"],
        "items": [
            {
                "type": "Container",
                "width": "100%",
                "height": "100%",
                "items": [
                    {
                        "type": "Image",
                        "width": "100%",
                        "height": "100%",
                        "source": "https://example.com/image.png",
                        "scale": "best-fit"
                    }
                ]
            }
        ]
    }
};

window.addEventListener('load', async () => {
    const container = document.getElementById('container');
    const comp = document.createElement(APLDataComponent.tag);
    comp.id = 'datacomp1';
    container.appendChild(comp);
    await comp.loadedDefer.promise;

    comp.setDocument(window._sampleDoc);

    comp.subscribe(BestAppsComponent.EVENT_CHANGED, (data) => {
        window._changedEvents.push({ type: data.data?.type });
    });

    window._testReady = true;
});
</script>
</body>
</html>

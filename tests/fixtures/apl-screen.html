<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>APLScreenComponent Test</title></head>
<body>
<script src="/webcomponents/utils/uid.js"></script>
<script src="/webcomponents/utils/APLComponentRegistry.js"></script>
<script src="/webcomponents/BestAppsComponent.js"></script>
<script src="/APLComponent.js"></script>
<script src="/APLScreen.js"></script>
<script src="/APLScreenComponent.js"></script>
<div id="doc-container" style="width:500px;height:500px;"></div>
<div id="screen-container"></div>
<script>
window.addEventListener('load', () => {
    const screens = APLScreen.getScreens();
    const aplScreen = new APLScreen({
        container: document.getElementById('doc-container'),
        device: screens.echoShow2,
    });
    window._testScreen = aplScreen;
    const screenComponent = document.createElement(APLScreenComponent.tag);
    screenComponent.id = 'screen1';
    screenComponent.setOptions({ screen: aplScreen });
    document.getElementById('screen-container').appendChild(screenComponent);
});
</script>
</body>
</html>

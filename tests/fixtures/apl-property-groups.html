<div id="container"></div>
<script>
  // Sample property set: a Frame-like component with a name, two grouped
  // families (Size has 4 members, Padding has 3), a lone Border member
  // (borderRadius only -> should fall back to standalone), and one ungrouped.
  window.__makeTab = async function (props) {
    document.getElementById('container').innerHTML = '';
    const tab = document.createElement('apl-object-inspector-properties-tab-component');
    tab.id = 'tab1';
    await tab.setOptions({ tabName: 'Properties', properties: props });
    document.getElementById('container').appendChild(tab);
    await tab.loadedDefer.promise;
    return tab;
  };
</script>
